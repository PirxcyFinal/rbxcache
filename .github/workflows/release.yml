name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the builds to
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            extension: .exe
          # Each Mac build is made on a machine of its own kind, so it can be run there.
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            extension: .dmg
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            extension: .dmg
            arch: x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            extension: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy,rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev

      # The version comes from Cargo.toml and is part of every file name. A tag
      # that says something else would publish files under the wrong release.
      - name: Read the version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${{ inputs.tag || github.ref_name }}"
          if [[ "$tag" == v* && "$tag" != "v$version" ]]; then
            echo "tag $tag does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ASSET=rbxcache-$version-${{ matrix.platform }}${{ matrix.extension }}" >> "$GITHUB_ENV"

      - run: cargo fmt --check
      - run: cargo test --release --locked --target ${{ matrix.target }}
      - run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check the binary runs
        run: |
          binary="target/${{ matrix.target }}/release/rbxcache${{ runner.os == 'Windows' && '.exe' || '' }}"
          "$binary" --version > version.txt
          cat version.txt
          grep -q "rbxcache $VERSION" version.txt
          "$binary" changelog > changes.txt
          grep -q "^$VERSION" changes.txt

      - name: Package (Windows, Linux)
        if: runner.os != 'macOS'
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/rbxcache${{ runner.os == 'Windows' && '.exe' || '' }}" "dist/$ASSET"

      # macOS gets an app bundle in a disk image: the bundle is what Finder can
      # open, and Apple silicon refuses to run code that is not at least ad-hoc signed.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app="dist/image/rbxcache.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/rbxcache" "$app/Contents/MacOS/rbxcache"

          "$app/Contents/MacOS/rbxcache" icon icon.png --size 1024
          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size icon.png --out "icon.iconset/icon_${size}x${size}.png" > /dev/null
            sips -z $((size * 2)) $((size * 2)) icon.png --out "icon.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/rbxcache.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>rbxcache</string>
            <key>CFBundleDisplayName</key><string>rbxcache</string>
            <key>CFBundleIdentifier</key><string>dev.pirxcy.rbxcache</string>
            <key>CFBundleExecutable</key><string>rbxcache</string>
            <key>CFBundleIconFile</key><string>rbxcache</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$app"

          ln -s /Applications dist/image/Applications
          # On the hosted runners this now and then fails with "Resource busy"; a second go gets through.
          for attempt in 1 2 3; do
            hdiutil create -volname "rbxcache $VERSION" -srcfolder dist/image -ov -format UDZO "dist/$ASSET" && break
            test $attempt -lt 3
            sleep 5
          done

      - name: Verify the macOS build
        if: runner.os == 'macOS'
        run: |
          set -x
          # The runner has to be the kind of Mac the build is for, or running it proves nothing.
          test "$(uname -m)" = "${{ matrix.arch }}"
          hdiutil verify "dist/$ASSET"
          mkdir mounted
          hdiutil attach -nobrowse -readonly -mountpoint mounted "dist/$ASSET"
          app="mounted/rbxcache.app"
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          file "$app/Contents/MacOS/rbxcache" > file.txt
          cat file.txt
          grep -q "Mach-O 64-bit executable ${{ matrix.arch }}" file.txt
          test "$(lipo -archs "$app/Contents/MacOS/rbxcache")" = "${{ matrix.arch }}"
          test -s "$app/Contents/Resources/rbxcache.icns"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Run it from the image, as someone who has just opened the download would.
          "$app/Contents/MacOS/rbxcache" --version > mounted-version.txt
          grep -q "rbxcache $VERSION" mounted-version.txt
          "$app/Contents/MacOS/rbxcache" packs
          # Open the window and see that it stays up.
          "$app/Contents/MacOS/rbxcache" gui --tab info &
          pid=$!
          sleep 12
          kill -0 $pid
          kill $pid
          wait $pid || true
          hdiutil detach mounted || hdiutil detach -force mounted

      - name: Write the release notes
        run: jq -r --arg v "$VERSION" '.versions[] | select(.version == $v) | .changes[] | "- " + .' changelog.json > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}
      - if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: v${{ env.VERSION }}
          body_path: notes.md
          files: dist/${{ env.ASSET }}
