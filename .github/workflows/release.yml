name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: rbxcache-windows-x86_64.exe
            binary: rbxcache.exe
            test: true
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: rbxcache-macos-arm64
            binary: rbxcache
            test: true
          # Built on the Apple silicon runner, which cannot run this target's tests.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: rbxcache-macos-x86_64
            binary: rbxcache
            test: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: rbxcache-linux-x86_64
            binary: rbxcache
            test: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy,rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev
      - if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - if: matrix.test
        run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Every platform gets its own file name, so the uploads do not replace each other.
      - shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
