[package]
name = "rbxcache"
version = "1.1.1"
edition = "2021"
description = "Viewer and editor for the Roblox client asset cache (rbx-storage)"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
draco-core = "2.3.3"
eframe = "0.31"
egui_extras = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
md-5 = "0.10"
open = "5"
rbx_binary = "3.0.1"
rbx_dom_weak = "4.2.0"
rbx_xml = "3.0.1"
rfd = "0.15"
rodio = "0.23.0"
rusqlite = { version = "0.32", features = ["bundled"] }
ruzstd = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texpresso = "2"
texture2ddecoder = "0.1.2"
ureq = "2"
xxhash-rust = { version = "0.8", features = ["xxh32"] }

[profile.release]
opt-level = 3
strip = true

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6"
tray-icon = "0.26.1"
